<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="Planner mingguan sederhana yang bisa dipasang dan digunakan offline.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Rencana Mingguan</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202a24;
      --muted: #788179;
      --line: #e6e8df;
      --paper: #fffefa;
      --canvas: #f7f5ef;
      --green: #456b54;
      --green-soft: #e9f0e8;
      --orange: #df9469;
      --shadow: 0 18px 60px rgba(34, 48, 38, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1080px, 100% - 40px); margin: 0 auto; padding: 38px 0 64px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 28px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(32px, 5vw, 48px); letter-spacing: -.04em; line-height: 1; margin: 9px 0 10px; font-weight: 500; }
    .subtitle-row { display: flex; align-items: center; gap: 8px; }
    .subtitle { color: var(--muted); margin: 0; font-size: 14px; }
    .edit-subtitle { display: grid; place-items: center; flex: 0 0 28px; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--green); padding: 0; cursor: pointer; }
    .edit-subtitle:hover { background: var(--green-soft); }
    .edit-subtitle svg { width: 14px; height: 14px; }
    .subtitle-editor { display: flex; gap: 6px; margin-top: 7px; }
    .subtitle-editor[hidden] { display: none; }
    .subtitle-editor input { width: min(360px, 65vw); height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; outline: none; font: inherit; font-size: 12px; }
    .subtitle-editor button { border: 0; border-radius: 8px; padding: 0 10px; background: var(--green); color: white; font-size: 11px; font-weight: 700; cursor: pointer; }
    .week-nav { display: flex; align-items: center; gap: 10px; padding: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 4px 16px rgba(34,48,38,.03); }
    .week-nav button, .icon-button { border: 0; background: transparent; cursor: pointer; border-radius: 9px; }
    .week-nav button { width: 34px; height: 34px; font-size: 18px; color: var(--green); }
    .week-nav button:hover, .icon-button:hover { background: var(--green-soft); }
    .install-button { border: 1px solid var(--line); background: var(--paper); color: var(--green); border-radius: 10px; padding: 8px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .install-button:hover { background: var(--green-soft); }
    .install-button[hidden] { display: none; }
    .sync-panel { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
    .sync-status { display: block; color: var(--muted); font-size: 11px; margin-bottom: 7px; }
    .sync-form { display: flex; flex-wrap: wrap; gap: 6px; }
    .sync-form input { min-width: 0; width: 145px; height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 11px; }
    .sync-form button, .sync-signout { border: 0; border-radius: 8px; padding: 0 9px; background: var(--green); color: white; font-size: 11px; font-weight: 700; cursor: pointer; }
    .sync-form button.secondary, .sync-signout { background: var(--green-soft); color: var(--green); }
    .sync-signout[hidden], .sync-form[hidden] { display: none; }
    #weekLabel { min-width: 150px; text-align: center; font-size: 12px; font-weight: 700; }
    .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
    .sidebar, .main-card { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
    .sidebar { padding: 21px 16px 16px; }
    .section-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 14px 7px; }
    .day-list { display: grid; gap: 4px; }
    .day-button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 10px; border: 0; border-radius: 11px; background: transparent; text-align: left; cursor: pointer; }
    .day-button:hover { background: #f5f6f0; }
    .day-button.active { color: var(--green); background: var(--green-soft); font-weight: 700; }
    .day-name { font-size: 13px; }
    .day-date { margin-left: 6px; color: var(--muted); font-size: 11px; font-weight: 500; }
    .day-count { min-width: 22px; height: 22px; display: grid; place-items: center; border-radius: 99px; background: rgba(255,255,255,.8); color: var(--muted); font-size: 10px; }
    .progress-box { border-top: 1px solid var(--line); margin-top: 20px; padding: 18px 7px 4px; }
    .progress-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; }
    #progressText { color: var(--muted); font-size: 11px; font-weight: 600; }
    .progress-track { height: 6px; margin-top: 10px; background: #edf0e9; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: var(--green); border-radius: inherit; transition: width .2s ease; }
    .main-card { min-height: 530px; overflow: hidden; }
    .day-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 24px 27px 19px; border-bottom: 1px solid var(--line); }
    .day-heading { margin: 0; font: 500 28px/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
    #fullDate { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .today-badge { display: none; color: var(--green); background: var(--green-soft); border-radius: 99px; padding: 6px 10px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .today-badge.visible { display: inline-flex; }
    .task-area { padding: 16px 27px 24px; }
    .task-list { min-height: 100px; }
    .empty-state { min-height: 125px; display: grid; place-content: center; text-align: center; color: var(--muted); font-size: 13px; }
    .empty-icon { font-size: 24px; margin-bottom: 8px; }
    .task-row { display: grid; grid-template-columns: 20px minmax(0,1fr) auto 32px; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #eff0eb; }
    .task-row:last-child { border-bottom: 0; }
    .task-check { appearance: none; width: 18px; height: 18px; border: 1.5px solid #bec8bc; border-radius: 6px; cursor: pointer; display: grid; place-items: center; margin: 0; }
    .task-check:checked { background: var(--green); border-color: var(--green); }
    .task-check:checked::after { content: "✓"; color: white; font-size: 12px; line-height: 1; }
    .task-title { font-size: 14px; overflow-wrap: anywhere; }
    .task-row.done .task-title { color: #9aa29a; text-decoration: line-through; }
    .task-time { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .icon-button { width: 30px; height: 30px; color: #a0a79f; font-size: 19px; }
    .add-form { display: grid; grid-template-columns: minmax(0,1fr) 110px 42px; gap: 8px; padding-top: 15px; border-top: 1px solid var(--line); }
    .add-form input { min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fff; color: var(--ink); font-size: 13px; }
    .add-form input:focus, textarea:focus { border-color: #8ba18e; box-shadow: 0 0 0 3px rgba(69,107,84,.1); }
    .add-form input[type="time"] { color: var(--muted); }
    .add-button { border: 0; border-radius: 10px; background: var(--green); color: white; font-size: 21px; cursor: pointer; }
    .add-button:hover { background: #355740; }
    .notes { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 19px; }
    .notes label { display: block; margin-bottom: 9px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .notes textarea { width: 100%; min-height: 68px; resize: vertical; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fff; color: var(--ink); font-size: 13px; line-height: 1.5; }
    footer { text-align: center; color: #959c94; font-size: 11px; margin-top: 18px; }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 520px); padding: 25px 0 40px; }
      header { display: block; margin-bottom: 17px; }
      .week-nav { width: fit-content; margin-top: 18px; }
      #weekLabel { min-width: 145px; }
      .layout { grid-template-columns: 1fr; gap: 13px; }
      .sidebar { padding: 13px 12px 11px; border-radius: 16px; }
      .section-label { margin: 2px 4px 9px; }
      .day-list { display: flex; gap: 6px; overflow-x: auto; padding: 1px 0 4px; scrollbar-width: thin; }
      .day-button { flex: 0 0 auto; width: auto; min-width: 66px; display: grid; justify-items: center; gap: 5px; padding: 9px 10px; }
      .day-date { display: block; margin: 2px 0 0; text-align: center; }
      .day-count { display: none; }
      .progress-box { margin-top: 11px; padding: 12px 4px 2px; }
      .main-card { min-height: 450px; border-radius: 16px; }
      .day-header { padding: 20px 18px 16px; }
      .day-heading { font-size: 25px; }
      .task-area { padding: 10px 18px 19px; }
      .task-row { grid-template-columns: 20px minmax(0,1fr) auto 30px; gap: 8px; }
      .task-title { font-size: 13px; }
      .add-form { grid-template-columns: minmax(0,1fr) 90px 40px; gap: 6px; }
      .add-form input { padding: 0 9px; font-size: 12px; }
    }
    @media (max-width: 370px) {
      .add-form { grid-template-columns: minmax(0,1fr) 40px; }
      .add-form input[type="time"] { grid-column: 1 / -1; grid-row: 2; }
      .add-button { grid-column: 2; grid-row: 1; }
      .task-time { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <div class="eyebrow">Ruang untuk minggu ini</div>
        <h1>Rencana Mingguan</h1>
        <div class="subtitle-row">
          <p class="subtitle" id="subtitleText">Sedikit demi sedikit, satu hari pada satu waktu.</p>
          <button class="edit-subtitle" id="editSubtitleButton" type="button" aria-label="Ubah kalimat pembuka" title="Ubah kalimat pembuka">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 5 4 4M4 20l4.2-.8L19 8.4a2.1 2.1 0 0 0-3-3L5.2 16.2 4 20Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <form class="subtitle-editor" id="subtitleEditor" hidden>
          <input id="subtitleInput" type="text" maxlength="100" aria-label="Kalimat pembuka">
          <button type="submit">Simpan</button>
        </form>
      </div>
      <div>
        <div class="week-nav" aria-label="Pilih minggu">
          <button id="prevWeek" aria-label="Minggu sebelumnya">‹</button>
          <span id="weekLabel"></span>
          <button id="nextWeek" aria-label="Minggu berikutnya">›</button>
        </div>
        <button class="install-button" id="installButton" type="button" hidden>Pasang aplikasi</button>
        <section class="sync-panel" aria-label="Sinkronisasi perangkat">
          <span class="sync-status" id="syncStatus" role="status">Agenda tersimpan di perangkat ini.</span>
          <form class="sync-form" id="syncForm">
            <input id="syncEmail" type="email" autocomplete="email" placeholder="Email" aria-label="Email akun sinkronisasi" required>
            <input id="syncPassword" type="password" autocomplete="current-password" placeholder="Kata sandi" aria-label="Kata sandi akun sinkronisasi" minlength="8" required>
            <button type="submit">Masuk</button>
            <button class="secondary" id="createAccountButton" type="button">Buat akun</button>
          </form>
          <button class="sync-signout" id="syncSignOut" type="button" hidden>Keluar</button>
        </section>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <p class="section-label">Hari dalam minggu</p>
        <nav class="day-list" id="dayList" aria-label="Hari dalam minggu"></nav>
        <div class="progress-box">
          <div class="progress-top"><span>Progress minggu ini</span><span id="progressText">0%</span></div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </aside>
      <main class="main-card">
        <div class="day-header">
          <div><h2 class="day-heading" id="dayHeading"></h2><div id="fullDate"></div></div>
          <span class="today-badge" id="todayBadge">Hari ini</span>
        </div>
        <section class="task-area" aria-label="Agenda harian">
          <div class="task-list" id="taskList"></div>
          <form class="add-form" id="addForm">
            <input id="taskInput" type="text" maxlength="120" placeholder="Tambah kegiatan..." aria-label="Nama kegiatan" required>
            <input id="timeInput" type="time" aria-label="Waktu kegiatan">
            <button class="add-button" type="submit" aria-label="Tambah kegiatan">+</button>
          </form>
          <div class="notes">
            <label for="notesInput">Catatan hari ini</label>
            <textarea id="notesInput" maxlength="500" placeholder="Tulis pengingat atau hal yang ingin kamu ingat..."></textarea>
          </div>
        </section>
      </main>
    </div>
    <footer>Agenda tersimpan otomatis. Masuk dengan akun yang sama di perangkat lain untuk menyinkronkannya.</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    (() => {
      const dayNames = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
      const shortDays = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
      const storeKey = 'rencana-mingguan-v1';
      const today = new Date();
      const mondayOf = date => {
        const result = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        result.setDate(result.getDate() - ((result.getDay() + 6) % 7));
        return result;
      };
      const iso = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      const formatDate = date => new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);
      const formatRange = start => {
        const end = new Date(start); end.setDate(end.getDate() + 6);
        const fmt = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short' });
        return `${fmt.format(start)} – ${fmt.format(end)} ${end.getFullYear()}`;
      };
      let data = {};
      try { data = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch { data = {}; }
      let weekStart = mondayOf(today);
      let selectedDate = iso(today);
      const $ = id => document.getElementById(id);
      const dayList = $('dayList');
      const entryFor = key => data[key] || (data[key] = { tasks: [], notes: '' });
      const save = () => {
        localStorage.setItem(storeKey, JSON.stringify(data));
        window.dispatchEvent(new CustomEvent('planner:data-changed', { detail: JSON.parse(JSON.stringify(data)) }));
      };
      const defaultSubtitle = 'Sedikit demi sedikit, satu hari pada satu waktu.';
      const subtitleText = $('subtitleText');
      const subtitleEditor = $('subtitleEditor');
      const subtitleInput = $('subtitleInput');
      const editSubtitleButton = $('editSubtitleButton');
      subtitleText.textContent = data.subtitle || defaultSubtitle;
      editSubtitleButton.addEventListener('click', () => {
        subtitleInput.value = subtitleText.textContent;
        subtitleEditor.hidden = false;
        editSubtitleButton.hidden = true;
        subtitleInput.focus();
        subtitleInput.select();
      });
      subtitleEditor.addEventListener('submit', event => {
        event.preventDefault();
        const nextSubtitle = subtitleInput.value.trim();
        if (nextSubtitle) {
          data.subtitle = nextSubtitle;
          subtitleText.textContent = nextSubtitle;
          save();
        }
        subtitleEditor.hidden = true;
        editSubtitleButton.hidden = false;
      });
      subtitleInput.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          subtitleEditor.hidden = true;
          editSubtitleButton.hidden = false;
        }
      });

      function render() {
        $('weekLabel').textContent = formatRange(weekStart);
        dayList.innerHTML = '';
        const dates = [];
        for (let i = 0; i < 7; i++) {
          const date = new Date(weekStart); date.setDate(date.getDate() + i); dates.push(date);
          const key = iso(date), item = data[key] || { tasks: [] };
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `day-button${key === selectedDate ? ' active' : ''}`;
          button.setAttribute('aria-pressed', key === selectedDate ? 'true' : 'false');
          button.innerHTML = `<span><span class="day-name">${shortDays[i]}</span><span class="day-date">${date.getDate()}</span></span><span class="day-count">${(item.tasks || []).length}</span>`;
          button.addEventListener('click', () => { selectedDate = key; render(); });
          dayList.append(button);
        }
        const selected = new Date(`${selectedDate}T12:00:00`);
        const idx = (selected.getDay() + 6) % 7;
        $('dayHeading').textContent = dayNames[idx];
        $('fullDate').textContent = formatDate(selected);
        $('todayBadge').classList.toggle('visible', selectedDate === iso(today));
        const entry = entryFor(selectedDate);
        $('notesInput').value = entry.notes || '';
        const list = $('taskList');
        list.innerHTML = '';
        const tasks = entry.tasks || [];
        if (!tasks.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.innerHTML = '<div><div class="empty-icon">✳</div>Belum ada agenda. Tambahkan satu hal kecil untuk dimulai.</div>';
          list.append(empty);
        } else {
          tasks.slice().sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99')).forEach(task => {
            const row = document.createElement('div');
            row.className = `task-row${task.done ? ' done' : ''}`;
            const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'task-check'; check.checked = !!task.done; check.setAttribute('aria-label', `Tandai ${task.title} selesai`);
            check.addEventListener('change', () => { task.done = check.checked; save(); render(); });
            const title = document.createElement('span'); title.className = 'task-title'; title.textContent = task.title;
            const time = document.createElement('span'); time.className = 'task-time'; time.textContent = task.time || '';
            const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'icon-button'; remove.textContent = '×'; remove.setAttribute('aria-label', `Hapus ${task.title}`);
            remove.addEventListener('click', () => { entry.tasks = entry.tasks.filter(t => t.id !== task.id); save(); render(); });
            row.append(check, title, time, remove); list.append(row);
          });
        }
        const allTasks = dates.flatMap(date => (data[iso(date)]?.tasks || []));
        const completed = allTasks.filter(task => task.done).length;
        const pct = allTasks.length ? Math.round(completed / allTasks.length * 100) : 0;
        $('progressText').textContent = `${pct}%`;
        $('progressFill').style.width = `${pct}%`;
      }
      $('addForm').addEventListener('submit', event => {
        event.preventDefault();
        const title = $('taskInput').value.trim();
        if (!title) return;
        const entry = entryFor(selectedDate);
        entry.tasks.push({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, title, time: $('timeInput').value, done: false });
        save(); $('taskInput').value = ''; $('timeInput').value = ''; render(); $('taskInput').focus();
      });
      $('notesInput').addEventListener('input', event => { entryFor(selectedDate).notes = event.target.value; save(); });
      $('prevWeek').addEventListener('click', () => { weekStart.setDate(weekStart.getDate() - 7); selectedDate = iso(weekStart); render(); });
      $('nextWeek').addEventListener('click', () => { weekStart.setDate(weekStart.getDate() + 7); selectedDate = iso(weekStart); render(); });
      let installPrompt;
      const installButton = $('installButton');
      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault(); installPrompt = event; installButton.hidden = false;
      });
      installButton.addEventListener('click', async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null; installButton.hidden = true;
      });
      window.addEventListener('appinstalled', () => { installButton.hidden = true; });
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
      window.plannerDataBridge = {
        getData: () => JSON.parse(JSON.stringify(data)),
        applyRemote(next) {
          if (!next || typeof next !== 'object' || Array.isArray(next)) return;
          data = next;
          localStorage.setItem(storeKey, JSON.stringify(data));
          subtitleText.textContent = data.subtitle || defaultSubtitle;
          render();
        }
      };
      render();
    })();
  </script>
  <script src="./sync.js"></script>
</body>
</html>
